name: security
# CI/CD 보안 점검 자동화: SAST(Semgrep) + SCA(pip-audit) + 시크릿 탐지(gitleaks)
on:
  push:
  pull_request:
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep 정적 분석 (공개 룰셋 + 프로젝트 커스텀 룰)
        run: |
          pip install semgrep
          # p/python, p/security-audit: 공개 룰셋 / .semgrep: 프로젝트 커스텀 룰
          semgrep --config p/python --config p/security-audit --config backend/.semgrep \
                  --error --sarif --output semgrep.sarif || true
          semgrep --config p/python --config p/security-audit --config backend/.semgrep .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 취약점(CVE) 점검
        run: |
          pip install pip-audit
          # 알려진 CVE가 있는 패키지 탐지. 결과는 SECURITY.md에 기록·조치
          pip-audit -r backend/requirements.txt || true

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 히스토리 스캔(과거 커밋에 섞인 시크릿까지)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
